<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Rogasree Mart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="register-page">

    <div class="register-container">

        <div class="register-card">

            <a href="index.html" class="register-brand">
                <span>R</span>
                Rogasree Mart
            </a>

            <p class="register-label">JOIN OUR MARKETPLACE</p>

            <h1>Create your account</h1>

            <p class="register-subtitle">
                Create an account and start shopping with Rogasree Mart.
            </p>


            <form id="registerForm">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >


                <label for="registerEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >


                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >


                <label for="registerPassword">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        required
                    >

                    <button
                        type="button"
                        onclick="toggleRegisterPassword()">
                        Show
                    </button>

                </div>


                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >


                <label class="terms-check">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the terms and conditions.
                    </span>

                </label>


                <button
                    type="submit"
                    class="register-button">

                    Create Account

                </button>

            </form>


            <p class="login-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <a href="index.html" class="back-role">
                ← Back to role selection
            </a>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
